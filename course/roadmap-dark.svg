<svg xmlns="http://www.w3.org/2000/svg" width="820" height="564" viewBox="0 0 820 564" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="title">El curso de un vistazo, 2026/27: las etapas de SAA y PIA, las vacaciones y los exámenes</title>
<desc id="desc">El tiempo avanza de izquierda a derecha, de octubre de 2026 a junio de 2027, y las etapas se enumeran en el orden recomendado; las fechas son estimaciones, los exámenes están fijados. 1 Primeros pasos (PIA), 14–25 oct. 2 Qué son la IA y el aprendizaje automático (SAA), 19–25 oct. 3 Python para IA (PIA), 19 oct – 1 nov. 4 Trabajar con datos (PIA), 26 oct – 6 dic. 5 Aprendizaje supervisado (SAA), 9 nov – 31 ene. 6 Construir con modelos de lenguaje (PIA), 7 dic – 17 ene. 7 Servir modelos (PIA), 18–31 ene. 8 Redes neuronales (SAA), 1–28 feb. 9 Agentes y MCP (PIA), 1 feb – 21 mar. Exámenes: SAA mar 2 feb, PIA jue 4 feb. 10 Cómo funcionan los modelos de lenguaje (SAA), 15 mar – 4 abr. 11 Generación aumentada por recuperación (RAG) (PIA), 30 mar – 18 abr. 12 Automatización y negocio (PIA), 19 abr – 2 may. 13 Aprendizaje no supervisado (SAA), 26 abr – 16 may. 14 Visión y voz con modelos preentrenados (PIA), 10–23 may. 15 Aprendizaje por refuerzo (SAA), 10–23 may. Exámenes: SAA lun 24 may, PIA mié 26 may. Exámenes: SAA jue 10 jun, PIA lun 14 jun. Vacaciones: Navidad, 22 dic – 7 ene; Semana Santa, 22–29 mar.</desc>
